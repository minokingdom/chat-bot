<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <style>
        html,
        body {
            background-color: #000000 !important;
        }
    </style>
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
    <title>Kiosk Manager</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Kiosk Manager">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #000000;
            /* Start black */
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            color: #1C1C1E;
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
        }

        /* Splash Screen */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.5s ease-out;
        }

        .splash-icon {
            width: 120px;
            height: 120px;
            border-radius: 24px;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
        }

        .splash-text {
            position: absolute;
            bottom: 40px;
            color: #ffffff;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            opacity: 0.7;
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 5px;
        }

        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.1);
            border-radius: 10px;
        }

        .ios-blur {
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            background-color: rgba(255, 255, 255, 0.7);
        }

        /* Markdown spacing within messages */
        .prose-ios p {
            margin-top: 0.8rem;
            margin-bottom: 0.8rem;
            line-height: 1.6;
        }

        .prose-ios p:first-child {
            margin-top: 0;
        }

        .prose-ios p:last-child {
            margin-bottom: 0;
        }

        .prose-ios strong {
            color: inherit;
            font-weight: 700;
        }

        .prose-ios ul,
        .prose-ios ol {
            margin: 0.6rem 0;
            padding-left: 1.25rem;
        }

        .prose-ios li {
            margin: 0.3rem 0;
        }

        @keyframes iosSpring {
            0% {
                transform: scale(0.95) translateY(20px);
                opacity: 0;
            }

            100% {
                transform: scale(1) translateY(0);
                opacity: 1;
            }
        }

        .animate-ios {
            animation: iosSpring 0.4s cubic-bezier(0.17, 0.89, 0.32, 1.1) forwards;
        }

        .pb-safe {
            padding-bottom: env(safe-area-inset-bottom);
        }
    </style>
    <script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "lucide-react": "https://esm.sh/lucide-react@^0.563.0",
    "@google/generative-ai": "https://esm.sh/@google/generative-ai@^0.21.0",
    "react-markdown": "https://esm.sh/react-markdown@^9.0.1"
  }
}
</script>
</head>

<body>
    <div id="debug-error-display"
        style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:white; color:red; z-index:9999; padding:20px; text-align:left; white-space:pre-wrap; overflow:auto;">
        <h3>Application Error</h3>
        <div id="error-content"></div>
    </div>
    <script>
        window.onerror = function (msg, url, line, col, error) {
            var display = document.getElementById('debug-error-display');
            var content = document.getElementById('error-content');
            if (display && content) {
                display.style.display = 'block';
                content.innerText += "Error: " + msg + "\nAt: " + url + ":" + line + ":" + col + "\nStack: " + (error ? error.stack : 'N/A') + "\n\n";
            }
            return false;
        };
        window.addEventListener('unhandledrejection', function (event) {
            var display = document.getElementById('debug-error-display');
            var content = document.getElementById('error-content');
            if (display && content) {
                display.style.display = 'block';
                content.innerText += "Unhandled Rejection: " + event.reason + "\n\n";
            }
        });
    </script>
    <div id="splash-screen">
        <img src="/pwa-192x192.png" alt="Logo" class="splash-icon animate-pulse" />
        <p class="splash-text">Artificial Intelligence v1.0</p>
    </div>
    <div id="root"></div>
    <script>
        window.addEventListener('load', () => {
            const splash = document.getElementById('splash-screen');
            setTimeout(() => {
                splash.style.opacity = '0';
                setTimeout(() => {
                    splash.style.display = 'none';
                    document.body.style.backgroundColor = '#F2F2F7'; // Reset to app bg color
                }, 500);
            }, 800);
        });
    </script>
    <script type="module" src="/index.tsx"></script>
</body>

</html>
